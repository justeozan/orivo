[package]
name = "orivo"
version = "0.3.0"
description = "A focused, local-first game library."
authors = ["Orivo"]
edition = "2024"
rust-version = "1.92"

[lib]
name = "orivo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
futures-util = "0.3"
ed25519-dalek = { version = "2", default-features = false, features = ["alloc"] }
flate2 = "1"
keyring = "4.1.5"
libc = "0.2"
object = { version = "0.39", default-features = false, features = ["read"] }
plist = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.11.5", features = ["protocol-asset"] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tar = "0.4"
tokio = { version = "1", features = ["time"] }
wasmtime = { version = "=44.0.0", default-features = false, features = ["component-model", "cranelift", "runtime"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"

[dev-dependencies]
wit-parser = "=0.246.2"
