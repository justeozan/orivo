[package]
name = "orivo"
version = "0.2.0"
description = "A focused, local-first game library."
authors = ["Orivo"]
edition = "2024"
rust-version = "1.92"

[lib]
name = "orivo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
plist = "1"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = ["protocol-asset"] }
