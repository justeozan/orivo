[package]
name = "orivo"
version = "0.3.7"
description = "A focused, local-first game library."
authors = ["Ozan Sahin"]
license-file = "../LICENSE"
repository = "https://github.com/justeozan/orivo"
publish = false
edition = "2024"
rust-version = "1.92"

[lib]
name = "orivo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
futures-util = "0.3"
ed25519-dalek = { version = "2", default-features = false, features = ["alloc"] }
flate2 = "1"
# HMAC-SHA256 for the plugin compile cache, where an artifact is only
# deserialised — that is, mapped executable and run — if a key held in the system
# keychain says Orivo wrote it. Costs nothing new to build: `hmac 0.12` is
# already in the lockfile behind `hkdf`, and its only dependency is the `digest`
# that `sha2` already pulls. It buys `Mac::verify_slice`, a constant-time tag
# comparison through `subtle`, instead of a hand-rolled RFC 2104 loop and a
# hand-rolled `==` in the one place in this repository where getting it wrong is
# native code execution. MIT OR Apache-2.0 (RustCrypto).
hmac = "0.12"
# 32 bytes from the OS CSPRNG, once per installation, for that key. Also already
# in the lockfile at this version, also MIT OR Apache-2.0; one function
# (`getrandom::fill`) against `/dev/urandom`, `getrandom(2)` and
# `BCryptGenRandom` rather than this repository choosing a source per platform.
getrandom = "0.3"
keyring = "4.1.5"
libc = "0.2"
object = { version = "0.39", default-features = false, features = ["read"] }
plist = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# Provider for the rustls client Tauri builds in its dev+mobile protocol handler;
# that path only installs one when the devUrl is https, which ours is not. `ring`
# is already in the lockfile through reqwest, so this adds no new crate.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.11.5", features = ["protocol-asset"] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tar = "0.4"
tokio = { version = "1", features = ["time"] }
url = "2"
wasmtime = { version = "=44.0.0", default-features = false, features = ["component-model", "cranelift", "runtime"] }
tauri-plugin-opener = "2"

# `rfd` only implements its dialog traits for desktop targets — there is no iOS
# backend alongside `backend/macos.rs`, so it cannot compile for iOS at all. The
# native pickers live behind the `desktop` cfg alias for the same reason.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rfd = "0.15"

[dependencies.tauri-plugin-orivo-saf]
# Local, and Android-only in effect: it exists to carry the Kotlin that receives
# the folder chooser's result into the generated Android project. Off Android its
# one call refuses. See `tauri-plugin-orivo-saf/README.md`.
path = "../tauri-plugin-orivo-saf"

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1.0"
jni = "0.21"
keyring-core = "1.0"
ndk-context = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"

# `keyring`'s default `v1` feature turns on `apple-native-keyring-store/keychain`
# but never `protected`, and that crate compile_error!s on iOS without it. There
# is no `keyring` feature that enables `protected` alone — only `cli`, which
# would also pull in the Linux stores. Depending on it directly here makes cargo
# unify the two features, and only when the target is iOS.
#
# `keyring-core` is needed for the same reason Android lists it: `keyring`'s
# own bootstrap (`v1.rs::set_credential_store`) installs a default store only on
# macOS, Windows and Linux, so on iOS Orivo has to install one itself or every
# `Entry::new` fails with "No default store has been set".
[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "1.0", features = ["protected"] }
keyring-core = "1.0"

[target.'cfg(windows)'.dependencies]
# `Win32_Foundation` is `HANDLE`, `FILETIME` and the other shared scalars that
# `Win32_Storage_FileSystem`'s own signatures are written in — notably
# `GetFileInformationByHandle` and `BY_HANDLE_FILE_INFORMATION`, which is how the
# plugin host learns a granted folder's identity and an entry's link count from a
# handle rather than from a path. Generated types and link declarations only: no
# code, no transitive crate, same version, Windows-only. The alternative was
# hand-declaring a ten-field struct for a platform this repository cannot compile
# locally, which is the risk it exists to avoid.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
] }

[dev-dependencies]
wit-parser = "=0.246.2"

