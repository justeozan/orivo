[package]
name = "orivo"
version = "0.3.6"
description = "A focused, local-first game library."
authors = ["Ozan Sahin"]
license-file = "../LICENSE"
repository = "https://github.com/justeozan/orivo"
publish = false
edition = "2024"
rust-version = "1.92"

[lib]
name = "orivo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
futures-util = "0.3"
ed25519-dalek = { version = "2", default-features = false, features = ["alloc"] }
flate2 = "1"
keyring = "4.1.5"
libc = "0.2"
object = { version = "0.39", default-features = false, features = ["read"] }
plist = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.11.5", features = ["protocol-asset"] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tar = "0.4"
tokio = { version = "1", features = ["time"] }
url = "2"
wasmtime = { version = "=44.0.0", default-features = false, features = ["component-model", "cranelift", "runtime"] }
tauri-plugin-opener = "2"

[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.15"

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1.0"
jni = "0.21"
keyring-core = "1.0"
ndk-context = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"

[target.'cfg(windows)'.dependencies]
# `Win32_Foundation` is `HANDLE`, `FILETIME` and the other shared scalars that
# `Win32_Storage_FileSystem`'s own signatures are written in — notably
# `GetFileInformationByHandle` and `BY_HANDLE_FILE_INFORMATION`, which is how the
# plugin host learns a granted folder's identity and an entry's link count from a
# handle rather than from a path. Generated types and link declarations only: no
# code, no transitive crate, same version, Windows-only. The alternative was
# hand-declaring a ten-field struct for a platform this repository cannot compile
# locally, which is the risk it exists to avoid.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
] }

[dev-dependencies]
wit-parser = "=0.246.2"

