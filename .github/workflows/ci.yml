name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    name: Web (typecheck + unit tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

  e2e:
    name: E2E (Playwright)
    # The six visual goldens (e2e/__screenshots__) are rendered locally on
    # macOS; Linux ships different fonts and subpixel antialiasing, so a
    # `ubuntu-latest` runner would need its own baseline set to compare
    # against. Running on macos-latest instead keeps this job comparing
    # against the same goldens contributors update locally with
    # `e2e-locked.sh e2e/visual.spec.ts --update-snapshots` — one baseline,
    # not two — at the cost of a slower, pricier macOS runner.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright's Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Runs every project declared in playwright.config.ts — chromium-1536,
      # chromium-1040 and android-914 — the same three `pnpm test:e2e` runs
      # locally.
      - name: End-to-end and visual-golden tests
        run: pnpm test:e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: node_modules/.cache/playwright
          retention-days: 7

  rust:
    name: Rust (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `tauri::generate_context!()` embeds `frontendDist` (../dist) at compile
      # time and panics when the directory is missing, so the frontend has to be
      # built before any cargo invocation. `dist/` is gitignored.
      - name: Build the frontend
        run: pnpm exec vite build

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          key: ${{ matrix.platform }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev

      - name: Check the Rust crate
        run: cargo check --manifest-path src-tauri/Cargo.toml

      # `plugin_runtime.rs` is the one module whose implementation genuinely
      # differs per platform — handle-relative opens, a granted folder's trust,
      # that folder's identity — and `cargo check` cannot say whether any of it
      # is *right*. Windows is where that gap cost something: a change that
      # dropped every subdirectory from a plugin's directory listing shipped and
      # was found by reading the code, not by a test, because the tests that
      # would have caught it were `#[cfg(unix)]`. This runs the plugin host's own
      # tests where nothing else does.
      #
      # `plugin_compile_cache::` is here for the same reason and was missed once:
      # it opens slots without following a link, refuses a directory sitting at
      # one, and sets a directory's mode, and every one of those is spelled
      # differently on Windows. Its tests had never run there — a directory at a
      # slot name could not even be *opened* without
      # `FILE_FLAG_BACKUP_SEMANTICS`, so the slot stayed obstructed forever, and
      # nothing said so.
      #
      # Deliberately not the whole suite: the rest of the crate is
      # platform-independent and already covered on macOS and Linux, and a
      # Windows runner is the slowest in this matrix. The module paths are spelled
      # out rather than filtered on `plugin_`, which is a substring match and also
      # caught, for instance,
      # `catalog::tests::a_profile_cannot_change_the_plugin_that_owns_it` — a test
      # in another module, which this step has no business gating on.
      - name: Test the plugin host (Windows)
        if: matrix.platform == 'windows-latest'
        run: >
          cargo test --manifest-path src-tauri/Cargo.toml --lib --
          plugin_runtime:: plugin_scheduler:: plugin_compile_cache::

      # `orivo-plugin-sdk` (sdk/) links `orivo` as an rlib and its
      # `wit_compatibility` test is the one thing here that is *supposed* to
      # fail on a breaking change to wit/orivo-plugin.wit — a check that never
      # runs is not a guard. One platform is enough: the crate has no
      # platform-specific code, unlike the app it links.
      - name: Test the plugin SDK
        if: matrix.platform == 'ubuntu-22.04'
        run: cargo test -p orivo-plugin-sdk

  android:
    name: Android (cargo check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the frontend
        run: pnpm exec vite build

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: ndk;27.0.12077973

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          key: android

      # setup-android installs the NDK under $ANDROID_SDK_ROOT/ndk/<version> but
      # never puts its clang on PATH or points cc-rs at it, so crates with a C
      # build script (ring, for one) can't find a compiler for the target and
      # cargo check fails before it gets anywhere near our own code.
      - name: Point cc-rs at the NDK toolchain
        run: |
          NDK_BIN="$ANDROID_SDK_ROOT/ndk/27.0.12077973/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CC_aarch64_linux_android=$NDK_BIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$NDK_BIN/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$NDK_BIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"

      - name: Check the Rust crate (Android)
        env:
          RUSTFLAGS: "-C link-arg=-Wl,-z,max-page-size=16384"
        run: cargo check --manifest-path src-tauri/Cargo.toml --target aarch64-linux-android

  # Publishes reference numbers (docs/performance.md, "CI"), it does not gate a
  # PR: a wall-clock budget that fails on a noisy shared runner would just make
  # people re-run a job that never broke anything, which trains everyone to
  # ignore red. `continue-on-error` keeps the check visible without letting it
  # block a merge until docs/performance.md's proposed budgets are validated
  # and this job has run on `main` long enough to know its own variance.
  perf:
    name: Perf (reference numbers, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the frontend
        run: pnpm exec vite build

      - name: Bundle size
        run: node perf/bundle/measure-bundle.mjs | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install Playwright's Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Desktop only: the Rust bench needs `--release` on every run to mean
      # anything (docs/performance.md's "Reproduire ces mesures"), and the
      # Android measurements need a real emulator — both cost more than a
      # per-PR informational job should.
      - name: Web performance bench
        run: pnpm exec playwright test -c perf/web/playwright.perf.config.ts | tee -a "$GITHUB_STEP_SUMMARY"
