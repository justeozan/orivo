name: Auto tag on merge

# Every PR merged into main cuts a release: this workflow starts `tag.yml`, which
# works out the next version, bumps the version files, pushes the tag and
# dispatches `release.yml`. A patch release by default; the labels
# release:minor and release:major raise more, release:skip releases nothing.
# A PR that only touches docs or Markdown never starts this workflow; its
# changes ship, and are listed, with the next release.

on:
  pull_request:
    types: [closed]
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read
  actions: write

concurrency:
  group: auto-tag
  cancel-in-progress: false

jobs:
  tag:
    name: Start the tag workflow
    # Only a merged PR, never one that was merely closed.
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Pick the bump from the PR labels
        id: bump
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          bump="patch"
          # The biggest label wins when a PR carries several.
          for level in minor major; do
            case ",$LABELS," in *",release:$level,"*) bump="$level" ;; esac
          done
          case ",$LABELS," in
            *",release:skip,"*)
              echo "release:skip on the PR: nothing to release."
              bump=""
              ;;
          esac
          echo "bump=$bump" >> "$GITHUB_OUTPUT"

      - name: Start tag.yml
        if: steps.bump.outputs.bump != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BUMP: ${{ steps.bump.outputs.bump }}
        run: |
          set -euo pipefail
          # tag.yml picks the version itself: its runs are serialised, so two
          # PRs merged a minute apart get two consecutive versions.
          gh workflow run tag.yml --ref main -f bump="$BUMP"
          {
            echo "### Release requested ($BUMP)"
            echo ""
            echo "PR #${{ github.event.pull_request.number }} was merged. Follow it in [Actions → Tag release](${{ github.server_url }}/${{ github.repository }}/actions/workflows/tag.yml)."
          } >> "$GITHUB_STEP_SUMMARY"
