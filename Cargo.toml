[workspace]
members = ["src-tauri", "sdk/orivo-plugin-sdk"]
resolver = "2"

[profile.dev]
opt-level = 0
debug = 1
incremental = true
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 1

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = "symbols"

[patch.crates-io]
wry = { path = "src-tauri/patches/wry-0.55.1" }
