[package]
name = "orivo"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
build = "build.rs"

[dependencies]
slint = { version = "~1.17", features = ["renderer-femtovg-wgpu", "unstable-wgpu-29", "image-default-formats"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
plist = "1"
image = { version = "0.25", default-features = false, features = ["bmp", "jpeg", "png", "webp"] }

[build-dependencies]
slint-build = "~1.17"

[dev-dependencies]
i-slint-backend-testing = { version = "~1.17", features = ["system-testing"] }

# The selector decodes photographic 1080p artwork. A completely unoptimized
# `cargo run` makes that CPU work visibly block development builds, even though
# release is fast. This keeps iteration interactive without changing release.
[profile.dev]
opt-level = 1
