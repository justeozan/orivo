<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` lets the scene reach the edges of a phone screen;
      the compact block in styles.css pays for that with safe-area insets, so
      nothing lands under a camera cutout or the gesture bar. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0b0d" />
    <meta
      name="description"
      content="Orivo is a focused, local-first game library."
    />
    <title>Orivo</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
